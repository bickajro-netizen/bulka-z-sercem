<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<title>Plan sceny — Bułka z sercem</title>
<style>
  body{font-family:system-ui,Segoe UI,sans-serif;background:#111;color:#e8e8e8;margin:0;padding:24px}
  h1{font-size:18px;font-weight:600;margin:0 0 6px}
  p{font-size:13px;color:#9a9a9a;max-width:72ch;margin:0 0 16px}
</style>
</head>
<body>
<h1>Plan sceny (z lotu ptaka) — „Bułka z sercem”</h1>
<p>Wszystko z kartonu. Dwa „sklepy” po bokach (stoły szkolne + szyldy), ulica w środku, wspólne stoisko na festyn w głębi. Przerywana linia to trasy Gołębia Gucia; dolny szereg szesnastu kropek to finałowy ukłon.</p>
<svg viewBox="0 0 900 560" role="img" aria-label="Schemat sceny: dwa sklepy, ulica, stoisko festynowe, trasy gołębia, szesnastka aktorów na finał" xmlns="http://www.w3.org/2000/svg">
  <rect x="20" y="20" width="860" height="470" fill="#1a1a1a" stroke="#555" stroke-width="2"/>
  <text x="36" y="46" fill="#9a9a9a" font-size="12">SCENA (widownia u dołu)</text>

  <!-- lewy sklep -->
  <rect x="45" y="70" width="230" height="170" rx="10" fill="#242018" stroke="#d9a441" stroke-width="2"/>
  <text x="60" y="96" fill="#d9a441" font-size="14" font-weight="600">PIEKARNIA U ROMANA</text>
  <rect x="60" y="112" width="200" height="26" fill="#2b2b2b" stroke="#666"/>
  <text x="70" y="130" fill="#bbb" font-size="12">stół + kosz bułek (Gucio celuje tu)</text>
  <circle cx="75" cy="170" r="7" fill="#d9a441"/><text x="88" y="175" fill="#ddd" font-size="12">Roman</text>
  <circle cx="75" cy="195" r="7" fill="#777"/><text x="88" y="200" fill="#ddd" font-size="12">Kaśka</text>
  <rect x="60" y="208" width="26" height="18" rx="6" fill="#3a2f1e" stroke="#d9a441"/><text x="94" y="222" fill="#ddd" font-size="12">Darek (w wielkim chlebie)</text>

  <!-- prawy sklep -->
  <rect x="625" y="70" width="230" height="170" rx="10" fill="#1f2420" stroke="#7fb069" stroke-width="2"/>
  <text x="640" y="96" fill="#7fb069" font-size="14" font-weight="600">SKLEP U BASI</text>
  <rect x="640" y="112" width="200" height="26" fill="#2b2b2b" stroke="#666"/>
  <text x="650" y="130" fill="#bbb" font-size="12">stół + kasa (Jurek) + tabliczka rabatów</text>
  <circle cx="655" cy="170" r="7" fill="#7fb069"/><text x="668" y="175" fill="#ddd" font-size="12">Basia (z notesem)</text>
  <circle cx="655" cy="195" r="7" fill="#777"/><text x="668" y="200" fill="#ddd" font-size="12">Mela</text>

  <!-- ulica -->
  <text x="450" y="150" fill="#9a9a9a" font-size="13" text-anchor="middle">U L I C A&nbsp;&nbsp;P O G O D N A</text>
  <rect x="420" y="60" width="60" height="22" fill="#2b2b2b" stroke="#888"/>
  <text x="450" y="76" fill="#ddd" font-size="11" text-anchor="middle">Znaki? — znak: KARTON</text>
  <text x="450" y="205" fill="#777" font-size="11" text-anchor="middle">wejścia klientów: Janusz, babcia, plotkarki, Kuba, Profesor</text>

  <!-- stoisko wspólne -->
  <rect x="350" y="250" width="200" height="80" rx="8" fill="#26221a" stroke="#d9a441" stroke-dasharray="6 4"/>
  <text x="450" y="282" fill="#d9a441" font-size="13" font-weight="600" text-anchor="middle">STOISKO WSPÓLNE</text>
  <text x="450" y="300" fill="#ddd" font-size="12" text-anchor="middle">„U Romana i Basi” (obraz 3–4)</text>
  <text x="450" y="317" fill="#9a9a9a" font-size="11" text-anchor="middle">tu: pieczątka Grażyny, medal SKLEP ROKU</text>

  <!-- trasy Gucia -->
  <path d="M 700 90 C 560 40, 340 40, 130 108" fill="none" stroke="#e8e8e8" stroke-width="2" stroke-dasharray="7 5"/>
  <path d="M 130 118 C 340 180, 560 180, 700 92" fill="none" stroke="#e8e8e8" stroke-width="2" stroke-dasharray="7 5"/>
  <circle cx="700" cy="90" r="6" fill="#e8e8e8"/>
  <text x="712" y="86" fill="#e8e8e8" font-size="12">GUCIO (gołąb) — wchodzi z prawej</text>

  <!-- finał -->
  <g>
    <circle cx="90"  cy="430" r="8" fill="#d9a441"/><circle cx="130" cy="430" r="8" fill="#777"/>
    <circle cx="170" cy="430" r="8" fill="#777"/><circle cx="210" cy="430" r="8" fill="#3a2f1e" stroke="#d9a441"/>
    <circle cx="250" cy="430" r="8" fill="#7fb069"/><circle cx="290" cy="430" r="8" fill="#777"/>
    <circle cx="330" cy="430" r="8" fill="#777"/><circle cx="370" cy="430" r="8" fill="#555"/>
    <circle cx="410" cy="430" r="8" fill="#555"/><circle cx="450" cy="430" r="8" fill="#555"/>
    <circle cx="490" cy="430" r="8" fill="#555"/><circle cx="530" cy="430" r="8" fill="#555"/>
    <circle cx="570" cy="430" r="8" fill="#555"/><circle cx="610" cy="430" r="8" fill="#555"/>
    <circle cx="650" cy="430" r="8" fill="#555"/><circle cx="690" cy="430" r="8" fill="#e8e8e8"/>
  </g>
  <text x="90" y="460" fill="#d9a441" font-size="11">Roman</text>
  <text x="660" y="460" fill="#e8e8e8" font-size="11">Gucio (kłania się ostatni)</text>
  <text x="390" y="460" fill="#9a9a9a" font-size="11">szesnastka na finał — szpaler + ukłon</text>

  <!-- legenda -->
  <line x1="36" y1="520" x2="90" y2="520" stroke="#e8e8e8" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="100" y="524" fill="#9a9a9a" font-size="12">trasa Gucia (4 kradzieże: obraz 1, 2, 3 i finał)</text>
  <rect x="420" y="512" width="16" height="16" fill="#242018" stroke="#d9a441"/>
  <text x="444" y="524" fill="#9a9a9a" font-size="12">szyldy, tabliczki, chleb, skrzydła, pieczątka, medal — wszystko karton</text>
</svg>
</body>
</html>
